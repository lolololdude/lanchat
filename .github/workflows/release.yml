name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version number, for example 1.0.9
        required: true
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        run: |
          RAW="${{ inputs.version || github.event.release.tag_name }}"
          echo "VER=${RAW#v}" >> "$GITHUB_ENV"
      - run: bash build_deb.sh "$VER"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: lanchat_*_all.deb
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get version
        shell: bash
        run: |
          RAW="${{ inputs.version || github.event.release.tag_name }}"
          echo "VER=${RAW#v}" >> "$GITHUB_ENV"
      - name: Build exe and zip
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name lanchat lanchat.py
          powershell -NoProfile -Command "Compress-Archive -Path dist/lanchat.exe -DestinationPath lanchat-${VER}-windows-x64.zip"
      - name: Write winget manifests
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          SHA=$(sha256sum "lanchat-${VER}-windows-x64.zip" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          D="manifests/${OWNER}.LanChat"
          mkdir -p "$D"
          cat > "$D/${OWNER}.LanChat.yaml" << MANIFEST
          PackageIdentifier: ${OWNER}.LanChat
          PackageVersion: ${VER}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          MANIFEST
          cat > "$D/${OWNER}.LanChat.installer.yaml" << MANIFEST
          PackageIdentifier: ${OWNER}.LanChat
          PackageVersion: ${VER}
          InstallerType: zip
          NestedInstallerType: portable
          NestedInstallerFiles:
            - RelativeFilePath: lanchat.exe
              PortableCommandAlias: lanchat
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/${OWNER}/lanchat/releases/download/v${VER}/lanchat-${VER}-windows-x64.zip
              InstallerSha256: ${SHA}
          ManifestType: installer
          ManifestVersion: 1.6.0
          MANIFEST
          cat > "$D/${OWNER}.LanChat.locale.en-US.yaml" << MANIFEST
          PackageIdentifier: ${OWNER}.LanChat
          PackageVersion: ${VER}
          PackageLocale: en-US
          Publisher: ${OWNER}
          PackageName: LanChat
          PackageUrl: https://github.com/${OWNER}/lanchat
          License: MIT
          ShortDescription: Minimal terminal chat for two machines on the same network.
          Moniker: lanchat
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          MANIFEST
          powershell -NoProfile -Command "Compress-Archive -Path $D/* -DestinationPath winget-manifests.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: |
            lanchat-*-windows-x64.zip
            winget-manifests.zip
