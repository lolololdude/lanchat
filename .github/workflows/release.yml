name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version number, for example 1.0.6
        required: true
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        run: |
          RAW="${{ inputs.version || github.event.release.tag_name }}"
          echo "VER=${RAW#v}" >> "$GITHUB_ENV"
      - run: bash build_deb.sh "$VER"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: lanchat_*_all.deb
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get version
        shell: bash
        run: |
          RAW="${{ inputs.version || github.event.release.tag_name }}"
          echo "VER=${RAW#v}" >> "$GITHUB_ENV"
      - name: Build exe, zip, and winget manifests
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          pip install pyinstaller
          pyinstaller --onefile --name lanchat lanchat.py
          ZIP="lanchat-${VER}-windows-x64.zip"
          powershell -NoProfile -Command "Compress-Archive -Path dist/lanchat.exe -DestinationPath $ZIP"
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          D="manifests/${OWNER}.LanChat"; mkdir -p "$D"
          for f in winget-template/*.yaml; do
            name=$(basename "$f" | sed "s/^PACKAGE/${OWNER}.LanChat/")
            sed -e "s/__OWNER__/${OWNER}/g" -e "s/__VERSION__/${VER}/g" -e "s/__SHA256__/${SHA}/g" "$f" > "$D/$name"
          done
          powershell -NoProfile -Command "Compress-Archive -Path $D/* -DestinationPath winget-manifests.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          files: |
            lanchat-*-windows-x64.zip
            winget-manifests.zip
